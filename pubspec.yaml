name: gan_nhau
description: Ứng dụng chia sẻ vị trí cho gia đình và bạn bè.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  battery_plus: ^6.0.3
  shared_preferences: ^2.3.2
  geocoding: ^5.0.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.4
  cached_network_image: ^4.0.4
  http: ^1.6.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  app_links: ^7.2.2
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_rounded_512.png
