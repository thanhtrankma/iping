# Tạo icon app: dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml
# Ảnh nguồn sinh từ scripts/make_branding.py
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/icon_master_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "assets/branding/adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
